# SB-05 타겟 정보, ELK dataset, KQL 쿼리 같은 대상 환경 정보

target_id: SB-05
name: ClusterDrain k3s Environment
description: k3s 기반 Kubernetes 클러스터와 공격자 EC2, AWS S3 유출 경로를 포함한 SB-05 대상 환경이다.
environment_type: k3s
primary_namespace: prod-platform
operation_defaults:
  pod_selector: orders-api
  collector_pod: sb05-collector
  service_account: sb05-reader
  staging_dir: /tmp/sb05_stage
  archive_name: sb05_archive.zip
  destination: private_s3_bucket
ssh:
  host: 44.196.147.30
  ssh_user: ubuntu
  ssh_key_path: 'C:\Users\KISIA\Downloads\Attacker-key.pem'
  ssh_port: 22
  local_hostnames:
    - sb05-attacker
segments:
  - segment_id: compromised-zone
    name: ATTACKER / COMPROMISED ZONE
    type: external
  - segment_id: kubernetes-zone
    name: KUBERNETES CLUSTER ZONE
    type: cluster
  - segment_id: cloud-storage-zone
    name: CLOUD STORAGE ZONE
    type: cloud
  - segment_id: monitoring-zone
    name: LOG & MONITORING ZONE
    type: monitoring
assets:
  - asset_id: sb05-attacker
    name: Compromised Deploy Host
    hostname: sb05-attacker
    private_ip: N/A
    public_ip: 44.196.147.30
    elastic_ip: 44.196.147.30
