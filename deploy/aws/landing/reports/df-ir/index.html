<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>침해사고 포렌식 보고서</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #eef2f7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #eef2f7;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 76px;
        padding: 14px 22px;
        border-bottom: 1px solid #d7dde8;
        background: rgba(255, 255, 255, 0.98);
      }
      .title {
        min-width: 0;
      }
      .title small {
        display: block;
        margin-bottom: 4px;
        color: #2563eb;
        font-size: 12px;
        font-weight: 800;
      }
      h1 {
        margin: 0;
        color: #101828;
        font-size: clamp(18px, 2.6vw, 24px);
        line-height: 1.2;
        letter-spacing: 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid #d7dde8;
        border-radius: 4px;
        background: #fff;
        color: #344054;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }
      .action.primary {
        border-color: #111827;
        background: #111827;
        color: #fff;
      }
      .viewer {
        display: block;
        width: 100%;
        height: calc(100vh - 76px);
        border: 0;
        background: #d8dee9;
      }
      .fallback {
        display: none;
        padding: 24px;
        color: #475467;
        font-size: 14px;
        line-height: 1.6;
      }
      @media (max-width: 720px) {
        header {
          align-items: flex-start;
          flex-direction: column;
          min-height: 134px;
        }
        nav {
          justify-content: flex-start;
          width: 100%;
        }
        .viewer {
          height: calc(100vh - 134px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <small>DF/IR Report · Kubernetes Cloud Incident</small>
        <h1>침해사고 포렌식 보고서</h1>
      </div>
      <nav aria-label="보고서 작업">
        <a class="action" href="/reports/">보고서 목록</a>
        <a class="action" href="/reports/files/incident-forensics-report.pdf" target="_blank" rel="noreferrer">새 탭 열기</a>
        <a class="action primary" href="/reports/files/incident-forensics-report.pdf" download>PDF 다운로드</a>
      </nav>
    </header>
    <iframe
      class="viewer"
      src="/reports/files/incident-forensics-report.pdf#toolbar=1&navpanes=0&view=FitH"
      title="침해사고 포렌식 보고서 PDF"
    ></iframe>
    <p class="fallback">
      브라우저에서 PDF 뷰어가 표시되지 않으면 상단의 새 탭 열기 또는 PDF 다운로드를 사용해 주세요.
    </p>
  </body>
</html>
