<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpaceBar Reports</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
        background: #f7f8fb;
        color: #111827;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        width: min(820px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }
      a { color: inherit; }
      .back {
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }
      h1 {
        margin: 22px 0 12px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.1;
      }
      p {
        color: #4b5563;
        line-height: 1.6;
      }
      .list {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }
      .item {
        display: block;
        padding: 18px 20px;
        border: 1px solid #d9dee8;
        border-radius: 8px;
        background: #fff;
        text-decoration: none;
      }
      .item:hover { border-color: #2563eb; }
      .item strong {
        display: block;
        margin-bottom: 6px;
        font-size: 18px;
      }
      .item span {
        color: #667085;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">← 메인으로</a>
      <h1>보고서 바로가기</h1>
      <p>프로젝트 검증 결과와 침해사고 대응 산출물을 확인하는 페이지입니다.</p>

      <section class="list" aria-label="보고서 링크">
        <a class="item" href="/dashboard/?campaign=SB-AD">
          <strong>BAS 리포트</strong>
          <span>BAS 대시보드에서 실행 결과, 탐지 여부, 자동 생성 리포트를 확인합니다.</span>
        </a>
        <a class="item" href="https://spacebar-mitre-attack-campaigns.vercel.app/campaigns/" target="_blank" rel="noreferrer">
          <strong>캠페인별 분석 산출물</strong>
          <span>공격 흐름, 로그 카탈로그, 탐지 룰, 증적 자료를 캠페인별로 확인합니다.</span>
        </a>
        <a class="item" href="https://spacebar-mitre-attack-campaigns.vercel.app/campaigns/SB-07/evidence/" target="_blank" rel="noreferrer">
          <strong>침해 증적 및 탐지 근거</strong>
          <span>AD/백신 우회 환경의 증적, 로그, 탐지 근거 자료를 확인합니다.</span>
        </a>
      </section>
    </main>
  </body>
</html>
