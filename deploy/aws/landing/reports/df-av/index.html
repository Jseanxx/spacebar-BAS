<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>백신 우회 환경 분석보고서</title>
    <style>
      :root {
        font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid #d7dde8;
        background: #fff;
      }
      a { color: #2563eb; font-weight: 700; text-decoration: none; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 65px);
        border: 0;
        background: #eef2f7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>백신 우회 환경 분석보고서</h1>
      <a href="/reports/">보고서 목록</a>
    </header>
    <iframe src="/reports/files/sb-av-df-report.pdf" title="백신 우회 환경 분석보고서 PDF"></iframe>
  </body>
</html>
