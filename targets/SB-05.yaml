    segment_id: compromised-zone
    platform: Ubuntu
    os: Ubuntu 24.04 LTS
    agent_role: campaign_agent
    agent_required: true
    criticality: high
    controls: [auditd, elastic_agent]
    logs: [Linux auditd, Elastic Agent]
    log_collection_status: Active
    log_collection_detail: Linux auditd, Elastic Agent
    description: 노출된 kubeconfig를 이용해 Kubernetes API를 호출하고 staging/archive/aws CLI를 실행하는 시작점
