    hostname: sb05-kubernetes
    private_ip: N/A
    public_ip: 54.209.58.38
    elastic_ip: 54.209.58.38
    role: k3s Kubernetes Node
    segment_id: kubernetes-zone
    platform: Kubernetes
    os: Ubuntu 24.04 LTS
    agent_required: false
    criticality: critical
    controls: [kube_audit, elastic_agent]
    logs: [k3s audit log]
    log_collection_status: Active
    log_collection_detail: k3s audit log
    description: API Server, 업무 namespace, Pod/Service/Ingress/Secret/RBAC 구성
