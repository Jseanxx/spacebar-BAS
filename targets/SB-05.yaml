    logs: [CloudTrail PutObject]
    log_collection_status: Active
    log_collection_detail: CloudTrail PutObject
    description: 수집 archive 업로드 대상 및 T1567.002 검증 대상
    position:
      left: 61.5
      top: 50
  - asset_id: sb05-elk
