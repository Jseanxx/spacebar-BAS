    resources: [orders-api, settlement-worker, notification-gateway, Service, Ingress, Secret, ConfigMap]
    log_collection_status: Active
    log_collection_detail: Kubernetes audit log
    description: 업무 서비스가 배포된 namespace이며 Discovery, Secret 조회, Pod exec 대상
    position:
      left: 37.5
      top: 78
