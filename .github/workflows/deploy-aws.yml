name: Deploy BAS Controller to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Build deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.playwright-mcp' \
            --exclude='frontend/node_modules' \
            --exclude='.venv' \
            --exclude='outputs' \
            --exclude='*.log' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf /tmp/spacebar-bas-deploy.tar.gz .

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BAS_AWS_SSH_KEY }}" > ~/.ssh/spacebar-bas.pem
          chmod 600 ~/.ssh/spacebar-bas.pem

      - name: Allow runner SSH access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BAS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BAS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BAS_AWS_REGION }}
          BAS_AWS_SECURITY_GROUP_ID: ${{ secrets.BAS_AWS_SECURITY_GROUP_ID }}
          BAS_AWS_SSH_PORT: ${{ secrets.BAS_AWS_SSH_PORT }}
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [ -z "${RUNNER_IP}" ]; then
            echo "Failed to resolve GitHub runner public IP." >&2
            exit 1
          fi
          printf '%s' "${RUNNER_IP}" > /tmp/github-actions-runner-ip
          aws --version
          aws ec2 authorize-security-group-ingress \
            --group-id "${BAS_AWS_SECURITY_GROUP_ID}" \
            --ip-permissions "IpProtocol=tcp,FromPort=${BAS_AWS_SSH_PORT:-2222},ToPort=${BAS_AWS_SSH_PORT:-2222},IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=GitHub Actions BAS deploy}]" \
            || true

      - name: Upload archive and deploy script
        env:
          BAS_AWS_HOST: ${{ secrets.BAS_AWS_HOST }}
          BAS_AWS_USER: ${{ secrets.BAS_AWS_USER }}
          BAS_AWS_SSH_PORT: ${{ secrets.BAS_AWS_SSH_PORT }}
          DASHBOARD_USER: ${{ secrets.BAS_DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.BAS_DASHBOARD_PASSWORD }}
          BAS_AGENT_TOKEN: ${{ secrets.BAS_AGENT_TOKEN }}
          BAS_SBAD_ELK_USERNAME: ${{ secrets.BAS_SBAD_ELK_USERNAME }}
          BAS_SBAD_ELK_PASSWORD: ${{ secrets.BAS_SBAD_ELK_PASSWORD }}
          BAS_PUBLIC_DOMAIN: ${{ secrets.BAS_PUBLIC_DOMAIN }}
        run: |
          {
            printf 'DASHBOARD_USER=%q\n' "${DASHBOARD_USER:-spacebar}"
            printf 'DASHBOARD_PASSWORD=%q\n' "${DASHBOARD_PASSWORD}"
            printf 'BAS_AGENT_TOKEN=%q\n' "${BAS_AGENT_TOKEN}"
            printf 'BAS_SBAD_ELK_USERNAME=%q\n' "${BAS_SBAD_ELK_USERNAME:-elastic}"
            printf 'BAS_SBAD_ELK_PASSWORD=%q\n' "${BAS_SBAD_ELK_PASSWORD}"
            printf 'BAS_PUBLIC_DOMAIN=%q\n' "${BAS_PUBLIC_DOMAIN:-kisia.kro.kr}"
          } > /tmp/spacebar-bas-deploy.env
          scp -i ~/.ssh/spacebar-bas.pem -P "${BAS_AWS_SSH_PORT:-2222}" -o StrictHostKeyChecking=no /tmp/spacebar-bas-deploy.tar.gz "${BAS_AWS_USER:-ubuntu}@${BAS_AWS_HOST}:/tmp/spacebar-bas-deploy.tar.gz"
          scp -i ~/.ssh/spacebar-bas.pem -P "${BAS_AWS_SSH_PORT:-2222}" -o StrictHostKeyChecking=no /tmp/spacebar-bas-deploy.env "${BAS_AWS_USER:-ubuntu}@${BAS_AWS_HOST}:/tmp/spacebar-bas-deploy.env"
          scp -i ~/.ssh/spacebar-bas.pem -P "${BAS_AWS_SSH_PORT:-2222}" -o StrictHostKeyChecking=no deploy/aws/update_remote.sh "${BAS_AWS_USER:-ubuntu}@${BAS_AWS_HOST}:/tmp/update_spacebar_bas.sh"

      - name: Deploy on EC2
        env:
          BAS_AWS_HOST: ${{ secrets.BAS_AWS_HOST }}
          BAS_AWS_USER: ${{ secrets.BAS_AWS_USER }}
          BAS_AWS_SSH_PORT: ${{ secrets.BAS_AWS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/spacebar-bas.pem -p "${BAS_AWS_SSH_PORT:-2222}" -o StrictHostKeyChecking=no "${BAS_AWS_USER:-ubuntu}@${BAS_AWS_HOST}" \
            "sudo bash -lc 'set -a; . /tmp/spacebar-bas-deploy.env; set +a; SPACEBAR_BAS_ARCHIVE=/tmp/spacebar-bas-deploy.tar.gz bash /tmp/update_spacebar_bas.sh; rm -f /tmp/spacebar-bas-deploy.env'"

      - name: Health check
        env:
          BAS_AWS_HOST: ${{ secrets.BAS_AWS_HOST }}
          BAS_PUBLIC_DOMAIN: ${{ secrets.BAS_PUBLIC_DOMAIN }}
          DASHBOARD_USER: ${{ secrets.BAS_DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.BAS_DASHBOARD_PASSWORD }}
        run: |
          PUBLIC_HOST="${BAS_PUBLIC_DOMAIN:-kisia.kro.kr}"
          curl --fail -u "${DASHBOARD_USER:-spacebar}:${DASHBOARD_PASSWORD}" "https://${PUBLIC_HOST}/api/health"

      - name: Revoke runner SSH access
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BAS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BAS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BAS_AWS_REGION }}
          BAS_AWS_SECURITY_GROUP_ID: ${{ secrets.BAS_AWS_SECURITY_GROUP_ID }}
          BAS_AWS_SSH_PORT: ${{ secrets.BAS_AWS_SSH_PORT }}
        run: |
          if [ ! -s /tmp/github-actions-runner-ip ]; then
            echo "No runner IP file found; nothing to revoke."
            exit 0
          fi
          RUNNER_IP="$(cat /tmp/github-actions-runner-ip)"
          aws ec2 revoke-security-group-ingress \
            --group-id "${BAS_AWS_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port "${BAS_AWS_SSH_PORT:-2222}" \
            --cidr "${RUNNER_IP}/32" \
            || true
